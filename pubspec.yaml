name: freshgarde
description: "FreshGarde - B2B agricultural trade and AI-assisted refrigerated transport platform (demo)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  google_fonts: ^8.0.0  # v9 depends on the decoupled material_ui package (TextTheme mismatch)
  webview_flutter: ^4.14.1
  image_picker: ^1.2.4
  http: ^1.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sim/
    - assets/images/
